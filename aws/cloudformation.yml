AWSTemplateFormatVersion: '2010-09-09'
Description: 'Scriblo High-Performance Editorial Platform - AWS Infrastructure (ECS Fargate, Redis ElastiCache, RDS MySQL, S3, CloudFront)'

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Environment stage (production, staging)

  DBPassword:
    Type: String
    NoEcho: true
    Description: Password for MySQL RDS database administrator

Resources:
  # 1. S3 Bucket for Media & Article Assets
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'scriblo-media-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # 2. ElastiCache Subnet Group & Redis Cluster
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnets for Scriblo Redis In-Memory Cluster
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      Engine: redis
      EngineVersion: '7.0'
      CacheNodeType: cache.t4g.small
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup

  # 3. RDS MySQL Database
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Scriblo MySQL RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  MySQLDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: '50'
      DBInstanceClass: db.t4g.medium
      Engine: mysql
      EngineVersion: '8.0'
      MasterUsername: scriblo_admin
      MasterUserPassword: !Ref DBPassword
      DBName: scriblo_db
      DBSubnetGroupName: !Ref DBSubnetGroup
      MultiAZ: true
      StorageType: gp3
      VPCSecurityGroups:
        - !Ref DBSecurityGroup

  # 4. ECS Fargate Cluster & Task Definition
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'scriblo-cluster-${EnvironmentName}'

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  FargateTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: scriblo-api
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: scriblo-api
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/scriblo-api:latest'
          PortMappings:
            - ContainerPort: 80
          Environment:
            - Name: DB_HOST
              Value: !GetAtt MySQLDatabase.Endpoint.Address
            - Name: DB_NAME
              Value: scriblo_db
            - Name: REDIS_HOST
              Value: !GetAtt RedisCluster.RedisEndpoint.Address
            - Name: AWS_S3_BUCKET
              Value: !Ref MediaBucket

  # Network Stubs (VPC & Subnets)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable Redis traffic
      VpcId: !Ref VPC

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable MySQL traffic
      VpcId: !Ref VPC

Outputs:
  RedisEndpoint:
    Description: ElastiCache Redis Primary Endpoint
    Value: !GetAtt RedisCluster.RedisEndpoint.Address
  DatabaseEndpoint:
    Description: RDS MySQL Endpoint
    Value: !GetAtt MySQLDatabase.Endpoint.Address
  S3BucketName:
    Description: S3 Assets Bucket
    Value: !Ref MediaBucket
